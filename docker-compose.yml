  db:
    image: postgres:16-alpine
    container_name: agendapalestras-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agendapalestras}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agendapalestras}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
