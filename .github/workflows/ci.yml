name: CI — Agenda de Palestras

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agendapalestras
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restaurar Dependências
      run: dotnet restore AgendaPalestras.sln

    - name: Compilar Solução (Release)
      run: dotnet build AgendaPalestras.sln -c Release --no-restore

    - name: Executar Testes Unitários
      run: dotnet test tests/AgendaPalestras.UnitTests/AgendaPalestras.UnitTests.csproj -c Release --no-build --logger "console;verbosity=normal"

    - name: Executar Testes de Arquitetura
      run: dotnet test tests/AgendaPalestras.ArchitectureTests/AgendaPalestras.ArchitectureTests.csproj -c Release --no-build --logger "console;verbosity=normal"

    - name: Executar Testes de Integração
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5433;Database=agendapalestras;Username=postgres;Password=postgres"
        POSTGRES_HOST: "localhost"
        POSTGRES_PORT: "5433"
        POSTGRES_DB: "agendapalestras"
        POSTGRES_USER: "postgres"
        POSTGRES_PASSWORD: "postgres"
      run: dotnet test tests/AgendaPalestras.IntegrationTests/AgendaPalestras.IntegrationTests.csproj -c Release --no-build --logger "console;verbosity=normal"
